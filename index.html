    function renderMatches(){const tabs=[{id:'all',label:'All'},...state.manifest.matches.map(match=>({id:String(match.id),label:`${match.home.split(' ')[0]} × ${match.away.split(' ')[0]}`}))];$('#matchTabs').innerHTML=tabs.map(tab=>`<button class="match-tab ${state.match===tab.id?'active':''}" data-match="${tab.id}">${tab.label}</button>`).join('');document.querySelectorAll('[data-match]').forEach(button=>button.onclick=()=>{state.match=button.dataset.match;renderMatches();renderEvents()})}function renderEvents(){const clips=state.manifest.clips.filter(clip=>state.match==='all'||String(clip.match_id)===state.match);$('#clipCount').textContent=`${clips.length} shots`;$('#events').innerHTML=clips.map(clip=>`<button class="event ${clip.id===state.selected?.id?'active':''}" data-clip="${clip.id}"><span class="event-time">${clip.time}<small>${clip.period===1?'First half':'Second half'}</small></span><span class="event-main"><strong>${clip.player}</strong><span>${clip.team}${clip.header?' · header':''}</span></span><span class="tag ${clip.goal?'goal':''}">${clip.goal?'goal':'shot'}</span></button>`).join('')||'<div class="empty">No shots in this match.</div>';document.querySelectorAll('[data-clip]').forEach(button=>button.onclick=()=>loadClip(state.manifest.clips.find(clip=>clip.id===button.dataset.clip)))}
    async function loadClip(clip){state.playing=false;updatePlay();state.selected=clip;state.index=0;state.accumulator=0;state.goalBall=null;cameraRig.ready=false;$('#loading').hidden=false;renderEvents();try{const response=await fetch(clip.file);if(!response.ok)throw new Error(`HTTP ${response.status}`);state.clip=await response.json();const shotIndex=state.clip.frames.reduce((best,frame,index)=>Math.abs(frame[0]-state.clip.shot_frame)<Math.abs(state.clip.frames[best][0]-state.clip.shot_frame)?index:best,0);state.shotIndex=shotIndex;state.goalBall=goalBallLatch(clip,state.clip,shotIndex);$('#timeline').max=Math.max(0,state.clip.frames.length-1);$('#shotMarker').style.left=`${shotIndex/Math.max(1,state.clip.frames.length-1)*100}%`;const match=state.manifest.matches.find(item=>item.id===clip.match_id);$('#eventMeta').textContent=`${clip.goal?'Goal':'Shot'} · ${clip.time} · ${clip.period===1?'First half':'Second half'}`;$('#eventName').textContent=clip.player;$('#fixture').textContent=`${match.home} ${match.home_score} — ${match.away_score} ${match.away} · ${clip.team}`;$('#teamKey').innerHTML=`<span><i style="background:#3559e8"></i>${match.home}</span><span><i style="background:#e75438"></i>${match.away}</span><span><i style="background:#ffd000"></i>shooter</span>`;renderFrame()}catch(error){console.error(error);$('#eventName').textContent='Unable to load this replay'}finally{$('#loading').hidden=true}}
    function updatePlay(){if(state.playing){cameraRig.position.copy(camera.position);cameraRig.target.copy(controls.target);controls.enabled=false}else{controls.enabled=true;controls.target.copy(cameraRig.target);controls.update()}const icon=$('#playIcon');icon.setAttribute('d',state.playing?'M7 5h4v14H7zm6 0h4v14h-4z':'M8 5.5v13l11-6.5z');$('#play').setAttribute('aria-label',state.playing?'Pause':'Play')}$('#play').onclick=()=>{state.playing=!state.playing;updatePlay()};$('#timeline').oninput=event=>{state.playing=false;updatePlay();state.index=Number(event.target.value);renderFrame()};$('#speed').onclick=()=>{const speeds=[.5,1,2],next=(speeds.indexOf(state.speed)+1)%speeds.length;state.speed=speeds[next];$('#speed').textContent=`${state.speed}×`};window.addEventListener('keydown',event=>{if(event.target.matches('button,input'))return;if(event.code==='Space'){event.preventDefault();state.playing=!state.playing;updatePlay()}if(event.code==='ArrowRight'&&state.clip){state.index=Math.min(state.clip.frames.length-1,state.index+1);renderFrame()}if(event.code==='ArrowLeft'&&state.clip){state.index=Math.max(0,state.index-1);renderFrame()}});
    function resize(){const box=$('#viewer').getBoundingClientRect();renderer.setSize(box.width,box.height,false);camera.aspect=box.width/Math.max(1,box.height);camera.updateProjectionMatrix();const pov=$('#pov').getBoundingClientRect();povRenderer.setSize(pov.width,pov.height,false);povCamera.aspect=pov.width/Math.max(1,pov.height);povCamera.updateProjectionMatrix()}window.addEventListener('resize',resize);resize();
    function animate(now){requestAnimationFrame(animate);const delta=Math.min(.1,(now-state.last)/1000);state.last=now;if(state.playing&&state.clip){state.accumulator+=delta*state.speed;const frameDuration=1/state.clip.fps;while(state.accumulator>=frameDuration){state.accumulator-=frameDuration;state.index=(state.index+1)%state.clip.frames.length;renderFrame()}}if(state.playing){const blend=1-Math.exp(-delta*5.5);cameraRig.position.lerp(cameraRig.desiredPosition,blend);cameraRig.target.lerp(cameraRig.desiredTarget,blend);camera.position.copy(cameraRig.position);camera.lookAt(cameraRig.target)}else controls.update();renderer.render(scene,camera);if(state.gaze){povCamera.position.copy(state.gaze.origin).addScaledVector(state.gaze.direction,.06);povCamera.up.set(0,1,0);povCamera.lookAt(state.gaze.origin.clone().addScaledVector(state.gaze.direction,15));visionLayer.visible=false;povRenderer.render(scene,povCamera);visionLayer.visible=true}else{povRenderer.setClearColor(0xd9ded6,1);povRenderer.clear()}}requestAnimationFrame(animate);
    async function init(){try{const response=await fetch('data/manifest.json');if(!response.ok)throw new Error(`HTTP ${response.status}`);state.manifest=await response.json();renderMatches();renderEvents();await loadClip(state.manifest.clips[0])}catch(error){console.error(error);$('#loading').textContent='Run the collection notebook and serve this folder over HTTP';$('#eventName').textContent='Data has not been generated yet'}}init();
  </script>
</body>
